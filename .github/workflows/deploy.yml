name: Build & Deploy GitHub Pages Dashboard

on:
  schedule:
    # Run once every hour from 9:00 AM IST to 4:00 PM IST (3:30 AM UTC to 10:30 AM UTC), Monday to Friday
    - cron: '30 3-10 * * 1-5'
    # Daily sync at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Purge Old Data & Generate Fresh Static JSON
        run: |
          rm -rf data/*.json
          python generate_data.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
