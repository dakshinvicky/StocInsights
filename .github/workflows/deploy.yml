name: Build & Deploy GitHub Pages Dashboard

on:
  schedule:
    # Run every 30 minutes during Indian Stock Market hours (03:30 UTC to 10:30 UTC / 9:00 AM to 4:00 PM IST Monday to Friday)
    - cron: '*/30 3-10 * * 1-5'
    # Also run daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data & Generate Static JSON
        run: |
          python generate_data.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
